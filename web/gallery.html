<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дудлы СберKids — галерея</title>
  <link rel="stylesheet" href="css/gallery.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <p class="eyebrow">СберKids · трек «Приколы»</p>
      <h1>Календарь дудлов</h1>
      <p class="lead">Маленькие праздники поверх главного экрана. Каждый дудл — запись в&nbsp;manifest.json и&nbsp;папка с&nbsp;картинками на CDN, без релиза приложения.</p>
      <dl class="stats" id="stats"></dl>
      <a class="back" href="index.html">← К прототипу</a>
    </div>
  </header>
  <main id="seasons" class="seasons"></main>

  <template id="card-tpl">
    <article class="card">
      <div class="stage">
        <div class="stage-avatar">
          <span class="face" aria-hidden="true">М</span>
        </div>
        <img class="stage-hero" alt="">
      </div>
      <div class="body">
        <div class="chips"><span class="chip chip--date"></span><span class="chip chip--prio"></span></div>
        <h3 class="title"></h3>
        <ul class="triggers"></ul>
        <blockquote class="fact"></blockquote>
        <div class="assets"></div>
        <p class="meta"></p>
        <a class="run" target="_self">Запустить в прототипе</a>
      </div>
    </article>
  </template>

  <script src="js/labels.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
